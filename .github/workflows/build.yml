# Bygger appen hver gang der pushes:
#  - web:   den installerbare webapp (mappen dist/) som artefakt, klar til at lægge på et domæne
#  - pages: lægger webappen på GitHub Pages (kun når repoet er offentligt; gratis dér)
#  - apk:   en færdig Android-app under "Releases", der kan installeres direkte på telefonen
# Ingen Mac eller Android Studio nødvendig.
name: Byg app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Webapp
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test og byg
        run: |
          npm ci
          npm test
          npm run build

      - name: Gem webappen som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: theos-balloner-web
          path: dist

  e2e:
    name: Røgtest i Chromium
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Hent den byggede webapp
        uses: actions/download-artifact@v4
        with:
          name: theos-balloner-web
          path: dist

      - name: Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Røgtest (tryk, swipe, ryst, menu, lyd, offline)
        run: npm run test:e2e

      - name: Gem skærmbilleder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaermbilleder
          path: test-results

  pages:
    name: Webapp på GitHub Pages
    # GitHub Pages er gratis for offentlige repos. Jobbet springes over, så længe repoet er privat,
    # og kører kun fra standard-branchen, så andre branches ikke overskriver siden.
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Hent den byggede webapp
        uses: actions/download-artifact@v4
        with:
          name: theos-balloner-web
          path: dist

      - name: Slå GitHub Pages til
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload til Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Udgiv
        id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle-cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test og byg web-delen
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Byg APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../TheosBalloner.apk

      - name: Gem APK som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: TheosBalloner-apk
          path: TheosBalloner.apk

      - name: Udgiv APK under Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TheosBalloner.apk \
            --target "$GITHUB_SHA" \
            --title "Theos Balloner – seneste build (nr. ${{ github.run_number }})" \
            --notes "Automatisk bygget fra \`${GITHUB_SHA::7}\` på branchen \`${GITHUB_REF_NAME}\`. Hent **TheosBalloner.apk** på telefonen og åbn filen for at installere."
