<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Theos Balloner" />
    <meta name="theme-color" content="#4fb3ff" />
    <meta name="format-detection" content="telephone=no" />
    <title>Theos Balloner</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="game" aria-label="Pop ballonerne"></canvas>

    <button id="parent-button" type="button" aria-label="Forældremenu (hold knappen nede)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1zm2 0h6V8a3 3 0 0 0-6 0v2zm3 4a1.5 1.5 0 0 0-.75 2.8V18a.75.75 0 0 0 1.5 0v-1.2A1.5 1.5 0 0 0 12 14z"
          fill="currentColor"
        />
      </svg>
    </button>

    <div id="parent-panel" hidden>
      <div class="card" role="dialog" aria-labelledby="parent-title">
        <div class="card-balloon" aria-hidden="true">🎈</div>
        <h1 id="parent-title">Theos Balloner</h1>
        <p class="subtitle">Forældremenu</p>
        <label class="row">
          <span class="row-label">🎵 Musik</span>
          <input type="checkbox" id="opt-music" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="row">
          <span class="row-label">🔊 Lyde</span>
          <input type="checkbox" id="opt-sfx" />
          <span class="switch" aria-hidden="true"></span>
        </label>
        <div class="row row-stacked">
          <span class="row-label">🎈 Tempo</span>
          <div id="tempo-options" class="segmented" role="group" aria-label="Tempo">
            <button type="button" data-tempo="rolig">🐢 Rolig</button>
            <button type="button" data-tempo="normal">🙂 Normal</button>
            <button type="button" data-tempo="vild">🚀 Vild</button>
          </div>
        </div>
        <div id="photo-section" hidden>
          <h2 class="section-title">📷 Familie-balloner</h2>
          <div id="photo-list" class="photo-list"></div>
          <div class="photo-actions">
            <label class="photo-button">
              🖼️ Vælg billede
              <input type="file" id="photo-pick" accept="image/*" multiple hidden />
            </label>
            <label class="photo-button">
              🤳 Tag et billede
              <input type="file" id="photo-snap" accept="image/*" capture="user" hidden />
            </label>
          </div>
          <p id="photo-status" class="lock-status"></p>
          <div id="crop-dialog" class="crop-dialog" hidden>
            <canvas id="crop-canvas" class="crop-canvas" aria-label="Klip ansigt"></canvas>
            <input id="crop-zoom" type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom" />
            <p id="crop-status" class="lock-status"></p>
            <div class="photo-actions">
              <button id="crop-save" type="button" class="photo-button photo-button-primary">✓ Gem ansigtet</button>
              <button id="crop-again" type="button" class="photo-button" hidden>↺ Nyt ansigt</button>
              <button id="crop-cancel" type="button" class="photo-button">✕ Luk</button>
            </div>
          </div>
        </div>
        <div id="lock-section" hidden>
          <button id="lock-button" type="button">🔒 Lås appen fast på skærmen</button>
          <p id="lock-status" class="lock-status"></p>
          <label class="row">
            <span class="row-label">🔐 Lås automatisk ved start</span>
            <input type="checkbox" id="opt-autolock" />
            <span class="switch" aria-hidden="true"></span>
          </label>
        </div>
        <div id="update-section" hidden>
          <h2 class="section-title">⬆️ Opdatering</h2>
          <p id="update-status" class="lock-status"></p>
          <div class="photo-actions">
            <button id="update-check" type="button" class="photo-button">🔎 Søg efter ny version</button>
            <button id="update-install" type="button" class="photo-button photo-button-primary" hidden>
              ⬇️ Hent og installér
            </button>
          </div>
          <details id="update-notes" hidden>
            <summary>Hvad er nyt</summary>
            <div id="update-notes-text" class="update-notes"></div>
          </details>
        </div>
        <button id="parent-close" type="button">Tilbage til ballonerne</button>
        <p class="hint">
          Låst app: Hjem, Tilbage og notifikationer virker ikke, før den låses op. På iPhone bruges
          <b>Guidet adgang</b> i stedet.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
